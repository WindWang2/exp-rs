name: SICNU GEO RS - Autonomous Platform CI

on:
  push:
    branches: [ master, main, 'agent/**' ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Tier 1 — Fast Required Build & Contract Verification
  # =========================================================================
  tier1-fast-required:
    name: Tier 1 - Fast Required (Linux GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev qt6-svg-dev qt6-multimedia-dev qt6-declarative-dev libqt6sql6-sqlite \
            libgdal-dev libproj-dev libgeos-dev libexpat1-dev libzip-dev \
            libprotobuf-dev protobuf-compiler \
            libqca-qt6-dev qtkeychain-qt6-dev \
            bison flex libpcre2-dev libcurl4-openssl-dev libgsl-dev

      - name: Configure CMake
        run: cmake -B build -S . -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Compile Core & Test Targets
        run: cmake --build build --parallel $(nproc)

      - name: Execute Fast CTest Suite
        env:
          QT_QPA_PLATFORM: offscreen
          # Synthetic fixture is deterministic; Linux tiers share one GDAL build,
          # so the golden SHA must match exactly. Drift is a real regression here.
          REQUIRE_STRICT_RPC_SHA: '1'
        run: ctest --test-dir build --output-on-failure

      - name: Verify Installation Rule Execution
        run: |
          cmake --install build --prefix /tmp/sicnu_install_test
          QT_QPA_PLATFORM=offscreen /tmp/sicnu_install_test/bin/sicnu_geo_rs_cli --help

  # =========================================================================
  # Tier 2 — Full Linux Integration & Sanitizer Suite
  # =========================================================================
  tier2-full-integration:
    name: Tier 2 - Full Integration & Sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Full Dependencies & OpenCV/Python
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev qt6-svg-dev qt6-multimedia-dev qt6-declarative-dev \
            libgdal-dev libproj-dev libgeos-dev libexpat1-dev libzip-dev \
            libprotobuf-dev protobuf-compiler \
            libqca-qt6-dev qtkeychain-qt6-dev \
            bison flex libpcre2-dev libcurl4-openssl-dev libgsl-dev \
            libopencv-dev python3-dev python3-pip python3-numpy

      - name: Configure CMake with Sanitizers
        run: cmake -B build-sanitizer -S . -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

      - name: Build Sanitizer Test Targets
        run: cmake --build build-sanitizer --parallel $(nproc)

      - name: Execute Sanitizer CTest Suite (ASan + UBSan)
        env:
          LSAN_OPTIONS: "detect_leaks=0"
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
          QT_QPA_PLATFORM: offscreen
          REQUIRE_STRICT_RPC_SHA: '1'
        run: ctest --test-dir build-sanitizer --output-on-failure

  # =========================================================================
  # Tier 3 — Cross-Platform Verification (Windows & macOS)
  # =========================================================================
  tier3-platform-windows:
    name: Tier 3 - Windows MSVC Build Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC & Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6 on Windows
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          # Pin 6.8.0 (stable metadata for win64_msvc2022_64). qtsvg and
          # qtdeclarative are BASE modules of the arch install (not add-on
          # modules), so they must NOT be listed in -m — aqt errors with
          # "packages not found" when they are.
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          # Qt 6.8+ ships prebuilt binaries only for MSVC 2022
          # (win64_msvc2019_64 was dropped); windows-latest provides MSVC 2022.
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtmultimedia'

      - name: Install GDAL/PROJ/GEOS/Protobuf via vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'd45238c8c7696e4136292d7d7d4e2352c3893a4f'

      - name: Configure CMake for Windows MSVC
        run: |
          # winflexbison provides win_bison.exe/win_flex.exe; src/core .yy/.ll
          # grammars require bison >= 3.0 (find_package(BISON) needs them on PATH).
          $bisonDir = "$env:VCPKG_ROOT\installed\x64-windows\tools\winflexbison"
          $env:PATH = "$bisonDir;$env:PATH"
          # WITH_AUTH=OFF: QCA/qtkeychain are not provisioned on this
          # build-verification tier (vcpkg would rebuild Qt6 from source to
          # satisfy them). Auth stays ON on the Linux/macOS tiers, which have
          # real qca + qtkeychain provisioning; the guard is compile-time.
          cmake -B build-win -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt-path }}" `
            -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBISON_EXECUTABLE="$bisonDir\win_bison.exe" `
            -DFLEX_EXECUTABLE="$bisonDir\win_flex.exe" `
            -DWITH_AUTH=OFF `
            -DENABLE_TESTS=OFF `
            -DSICNU_VENDOR_GDAL=OFF

      - name: Verify MSVC Compilation Guard & Headers
        run: cmake --build build-win --config Release --parallel

  tier3-platform-macos:
    name: Tier 3 - macOS Clang Configure & Build Seam
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS Dependencies via Homebrew
        run: |
          brew update
          brew install qt@6 qca qtkeychain gdal proj geos libzip gsl bison flex pcre2 cmake protobuf

      - name: Configure CMake for macOS
        # Homebrew's bison (>= 3.8) and flex are keg-only; macOS ships bison 2.x
        # which cannot parse %define api.pure / %locations in our .yy grammars.
        # Prepend the keg-only bins so CMake's find_package(BISON) picks them up.
        run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          bison --version | head -1
          cmake -B build-mac -S . \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix)" \
            -DBISON_EXECUTABLE="$(brew --prefix bison)/bin/bison" \
            -DFLEX_EXECUTABLE="$(brew --prefix flex)/bin/flex" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=ON

      - name: Verify macOS Build & Execute CTest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build-mac --parallel
          ctest --test-dir build-mac --output-on-failure
