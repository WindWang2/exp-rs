name: SICNU GEO RS - Autonomous Platform CI

on:
  push:
    branches: [ master, main, 'agent/**' ]
  pull_request:
    branches: [ master, main ]

# #1683: least privilege for GITHUB_TOKEN — no job in this workflow publishes
# anything, so the repo-default token permissions are pure attack surface.
# Jobs keep the inherited read-only set.
permissions:
  contents: read

concurrency:
  # #1490: GitHub keeps at most ONE pending run per concurrency group — a new
  # master push used to cancel the still-queued run for the previous push even
  # with cancel-in-progress=false (the old group keyed on workflow+ref made
  # every master push share one group; the 2026-10-14 dump of the last 25
  # master runs shows 15 cancelled and zero successes — see
  # .planning/r13-i-infra/evidence/master-runs-2026-10-14.json). Key push runs on the commit SHA so every
  # landed master commit gets its own uninterruptible run; PR runs keep the
  # per-ref group so a new commit on the same PR still supersedes the old one.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  # Only superseded PR runs are cancelled. Push runs are singletons in their
  # per-SHA group, so this flag only ever acts on pull_request events.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # Tier 1 — Fast Required Build & Contract Verification
  # =========================================================================
  tier1-fast-required:
    name: Tier 1 - Fast Required (Linux GCC)
    runs-on: ubuntu-latest
    # 360 = GitHub's hard platform cap; a larger number here is fiction (the
    # runner kills the job at 360 anyway, and a killed job skips post steps —
    # the ccache save below used to be lost exactly this way). Warm-ccache
    # runs measured ~2h45m total (run 36568313972); a fully cold run with an
    # evicted org cache cannot fit in 360 and needs a manual warm-up push.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Per-config key (WP-G / #1392 item 5). ccache is content-addressed
          # on preprocessed source + compiler args, so a Release object cache
          # is near-useless for the Debug+ASan tier2 job and vice versa: the
          # old shared `ci-ccache-${{ runner.os }}` key made tier2 restore
          # tier1's cache (0.19% hit rate measured at #1392). Key axes: job
          # config (build type, sanitizer), OS, compiler. append-timestamp
          # (action default) means each run saves under a fresh key and the
          # restore-keys prefix chain picks the newest prior save of the SAME
          # config — never another config's.
          key: ccache-tier1-Linux-gcc-Release
          restore-keys: |
            ccache-tier1-Linux-gcc-Release-
          # Repo-wide GH cache budget is 10GB shared with tier2/macOS ccache
          # and the Windows vcpkg archives; the Release object tree fits
          # comfortably in 2G compressed (overflow evicts LRU inside ccache,
          # which degrades gracefully instead of thrashing the shared pool).
          max-size: 2G

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang-tidy \
            libgdal-dev libproj-dev libgeos-dev libexpat1-dev libzip-dev libjsoncpp-dev \
            libprotobuf-dev protobuf-compiler \
            libqca-qt6-dev qtkeychain-qt6-dev \
            bison flex libpcre2-dev libcurl4-openssl-dev libgsl-dev \
            libopencv-dev python3-dev python3-pip python3-numpy \
            libfontconfig1 libgl1 libegl1 libxkbcommon0 libdbus-1-3

      # Qt 6.8 via aqtinstall: Ubuntu 24.04's distro Qt (6.4.2) is too old for
      # this codebase (QtTypes and friends are 6.5+). Base package already
      # includes qtsvg/qtdeclarative/qttools; add qt5compat + qtmultimedia.
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: '6.8.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qt5compat qtmultimedia'

      - name: Install Node (pi/ bridge lifecycle tests, #706)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure CMake
        # ENABLE_LTO=OFF: project default is ON for Release, but LTO links of
        # the QGIS-scale libraries take 1-2 h per target on 4-core runners and
        # risk OOM on the GCC link. CI's job is compile+link+test correctness,
        # not link-time optimization; a fast reliable gate is the contract here.
        # Ninja + ccache: faster scheduling and incremental rebuilds across
        # pushes/PRs (each later PR in the integration sequence only recompiles
        # its delta).
        # Python_EXECUTABLE: FindPython picks the hostedtoolcache python from
        # PATH, which has no numpy — the python_bindings_smoke test imports
        # numpy, so pin the system interpreter (python3-numpy via apt).
        run: cmake -B build -S . -G Ninja -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt-path }}" -DPython_EXECUTABLE=/usr/bin/python3 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # #1681: this lane used to run between configure and build, so every
      # ui_*.h / *.pb.h include (custom-command artifacts, 349 files by the
      # #1681 audit) failed clang-tidy with "file not found" under
      # --warnings-as-errors='*' before the build ever generated them. It now
      # runs AFTER the build so compile_commands.json points at a tree where
      # the generated headers exist.
      - name: Compile Core & Test Targets
        run: cmake --build build --parallel $(nproc)

      # #706/#1495: the repo's targeted .clang-tidy (12 checks for exactly the
      # #610-#658 bug classes) was dead config — first nothing ran it, then a
      # continue-on-error step that reported but never blocked (#1495). The
      # lane lints ONLY files changed vs origin/master with
      # --warnings-as-errors='*', so legacy backlog outside the diff cannot
      # flood the gate, while any NEW instance of the tracked bug classes in a
      # changed file fails the job. The script still exits 0 (documented
      # no-op) when clang-tidy/compile_commands.json are absent or the diff
      # has no C++ files — those states are printed, not silently passed.
      - name: Clang-Tidy Lint (changed files, blocking)
        run: |
          # #1683: fetch BOTH the base tip and the event commit with enough
          # history for the lane's merge-base to resolve, so it lints exactly
          # this branch's own changes (see scripts/run_clang_tidy_changed.sh;
          # on truncated history the lane falls back to the tip diff loudly).
          git fetch --no-tags --depth=500 origin master "${GITHUB_SHA}"
          ./scripts/run_clang_tidy_changed.sh origin/master build

      - name: Execute Fast CTest Suite
        env:
          QT_QPA_PLATFORM: offscreen
          # Synthetic fixture is deterministic; Linux tiers share one GDAL build,
          # so the golden SHA must match exactly. Drift is a real regression here.
          REQUIRE_STRICT_RPC_SHA: '1'
          # ModelCatalog fallback when tests run from build dirs.
          SICNU_MODELS_DIR: ${{ github.workspace }}/models
        # Tier 1 is the FAST signal lane (#1392 item 4): 8210 of the 8261
        # discovered cases, excluding the audited minutes-scale (SLOW) and
        # the 20min+ (LONG_RUN) session. -j4 uses the 4 cores; ctest still
        # honors the RUN_SERIAL registrations. One case per process (#1414)
        # keeps parallel cases isolated.
        run: ctest --test-dir build -LE "SLOW|LONG_RUN" -j4 --output-on-failure

      - name: Verify Installation Rule Execution
        run: |
          cmake --install build --prefix /tmp/sicnu_install_test
          # #1698/#R1-2b: the install RPATH makes the prefix self-sufficient
          # for the PROJECT's own lib/libsicnu_*.so (resolved via $ORIGIN/
          # ..../lib — they exist only there, so this env var cannot shadow
          # the relocatability proof). The aqt-installed Qt lives outside
          # ldconfig, so it is supplied explicitly for the smoke.
          LD_LIBRARY_PATH="${{ steps.qt.outputs.qt-path }}/lib" \
            QT_QPA_PLATFORM=offscreen /tmp/sicnu_install_test/bin/sicnu_geo_rs_cli --help
          # #1698: the isolated-execution worker must ship with the install
          # tree; the execution plane only falls back to PATH when it is not
          # next to the application binary.
          test -x /tmp/sicnu_install_test/bin/sicnu_worker

  # =========================================================================
  # Tier 2 — Full Linux Integration & Sanitizer Suite
  # =========================================================================
  tier2-full-integration:
    name: Tier 2 - Full Integration & Sanitizers
    runs-on: ubuntu-latest
    # 360 = GitHub's hard platform cap (see tier1 note). The sanitizer tier
    # is the longest pole; if it ever needs more than 360 the answer is
    # shrinking what it runs, not a fictional timeout.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Debug+ASan+UBSan objects are a different compilation universe from
          # tier1's Release (different -O/-g/-fsanitize args => different
          # content hashes). Separate key per config; restore-keys chain only
          # ever lands on prior saves of this same config.
          key: ccache-tier2-Linux-gcc-Debug-asan-ubsan
          restore-keys: |
            ccache-tier2-Linux-gcc-Debug-asan-ubsan-
          # Sanitizer+debug-info objects are several times the Release size;
          # 3G keeps headroom without crowding the shared 10GB cache budget.
          max-size: 3G

      - name: Install Full Dependencies & OpenCV/Python
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libgdal-dev libproj-dev libgeos-dev libexpat1-dev libzip-dev libjsoncpp-dev \
            libprotobuf-dev protobuf-compiler \
            libqca-qt6-dev qtkeychain-qt6-dev \
            bison flex libpcre2-dev libcurl4-openssl-dev libgsl-dev \
            libopencv-dev python3-dev python3-pip python3-numpy \
            libfontconfig1 libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: '6.8.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qt5compat qtmultimedia'

      - name: Configure CMake with Sanitizers
        # Python_EXECUTABLE: see the Tier 1 configure note (numpy lives on the
        # system python, not the hostedtoolcache one FindPython picks up).
        run: cmake -B build-sanitizer -S . -G Ninja -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt-path }}" -DPython_EXECUTABLE=/usr/bin/python3 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Sanitizer Test Targets
        run: cmake --build build-sanitizer --parallel $(nproc)

      - name: Execute Sanitizer CTest Suite (ASan + UBSan)
        env:
          LSAN_OPTIONS: "detect_leaks=0"
          # detect_odr_violation=0: sicnu_data is a STATIC library linked into
          # several shared libs (sicnu_processing, sicnu_operators, ...), so
          # moc-generated staticMetaObjects for its classes legitimately exist
          # in multiple .so files. ASan's ODR checker treats that as a violation
          # and aborts every test binary; the duplication is benign (each .so
          # uses its own copy consistently) and the sanitizer tier exists for
          # heap/UB detection, so ODR detection is disabled.
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0:detect_odr_violation=0"
          QT_QPA_PLATFORM: offscreen
          SICNU_MODELS_DIR: ${{ github.workspace }}/models
        run: ctest --test-dir build-sanitizer -LE "LONG_RUN" --output-on-failure
        # Full population under ASan/UBSan except the LONG_RUN 2400 s session
        # (mlops9_scale_longrun). Honest coverage note (review P1): at master
        # both Linux lanes ran unfiltered ctest that never completed inside
        # GitHub's 360-min job cap, so the longrun session ran only when the
        # queue reached it; it is now a deliberate, documented CI exclusion —
        # run it via `ctest -L LONG_RUN` sessions (TEST_INFRA.md). The SLOW
        # benchmark/scale clusters stay in sanitizer coverage. Serial: ASan +
        # Qt threads keep a conservative isolation margin.

  # =========================================================================
  # Tier 3 — Cross-Platform Verification (Windows & macOS)
  # =========================================================================
  tier3-windows-deps:
    name: Tier 3 - Windows vcpkg Deps (archive seeding)
    runs-on: windows-latest
    # One job per GitHub's 6h cap: the cold vcpkg source build of
    # gdal/opencv/abseil (~2.5h) plus the MSVC compile (~3.5h) cannot both
    # fit. This job ONLY seeds the vcpkg binary archives so its post-step
    # saves them (a killed job saves nothing — observed when the combined
    # job hit the cap with the cache still cold). tier3-platform-windows
    # then restores the archives and spends its whole budget compiling.
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC & Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Free disk space for vcpkg source builds
        # opencv+gdal from source need ~15GB in C:\vcpkg\buildtrees; the
        # windows-latest image ships Android/dotnet/Haskell toolchains that
        # otherwise leave C: full mid-build ("No space left on device" on
        # opencv PDB copy). Reclaim ~20GB before vcpkg runs.
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used,Free
          foreach ($p in @("C:\Android", "C:\Program Files\dotnet", "C:\Program Files (x86)\Android", "$env:AGENT_TOOLSDIRECTORY\..\..")) { if (Test-Path $p) { echo "keep $p" } }
          # Aggressive but safe on GH runners: drop large preinstalled SDKs.
          if (Test-Path "C:\Android") { Remove-Item -Recurse -Force "C:\Android" }
          if (Test-Path "C:\Program Files\dotnet") { Remove-Item -Recurse -Force "C:\Program Files\dotnet" }
          $haskell = Get-ChildItem "C:\ghcup" -ErrorAction SilentlyContinue; if ($haskell) { Remove-Item -Recurse -Force "C:\ghcup" }
          $codeql = Get-ChildItem "C:\Program Files\CodeQL" -ErrorAction SilentlyContinue; if ($codeql) { Remove-Item -Recurse -Force "C:\Program Files\CodeQL" }
          Get-PSDrive C | Select-Object Used,Free

      - name: Cache vcpkg binary archives
        # vcpkg's default binary cache (C:\Users\runneradmin\AppData\Local
        # \vcpkg\archives) is the one source of truth both this install step
        # AND the CMake toolchain's manifest install in the build job consult.
        # The former x-gha provider was REMOVED from the preinstalled vcpkg
        # ("The 'x-gha' binary caching backend has been removed"), so caching
        # the archives dir directly is the only provider-independent way.
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-archives-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-x64-windows-

      - name: Install GDAL/PROJ/GEOS/Protobuf via vcpkg (preinstalled)
        # windows-latest ships a maintained vcpkg checkout at C:\vcpkg. Sync it
        # to the pinned builtin-baseline in vcpkg.json (must match exactly or
        # transitive versions like expat/hdf5/opencv4 miss the version DB).
        # Checkout that baseline commit; do not use an unrelated tip.
        # --clean-after-build keeps C: from filling on the opencv/gdal source
        # builds; once the archives are warm this step is minutes.
        shell: pwsh
        run: |
          git -C C:\vcpkg fetch origin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C C:\vcpkg checkout 7f3781e19cc7d4e4882a4caec01668c6f7b5c163
          if ($LASTEXITCODE -ne 0) { exit 1 }
          C:\vcpkg\vcpkg install --triplet x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit 1 }

  tier3-platform-windows:
    name: Tier 3 - Windows MSVC Build Verification
    needs: tier3-windows-deps
    runs-on: windows-latest
    # 360 = GitHub's hard platform cap (see tier1 note).
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC & Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Free disk space for vcpkg source builds
        # Compile-time disk headroom (Qt+vcpkg installed trees + build-win
        # object files/PDBs run into tens of GB).
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used,Free
          foreach ($p in @("C:\Android", "C:\Program Files\dotnet", "C:\Program Files (x86)\Android", "$env:AGENT_TOOLSDIRECTORY\..\..")) { if (Test-Path $p) { echo "keep $p" } }
          if (Test-Path "C:\Android") { Remove-Item -Recurse -Force "C:\Android" }
          if (Test-Path "C:\Program Files\dotnet") { Remove-Item -Recurse -Force "C:\Program Files\dotnet" }
          $haskell = Get-ChildItem "C:\ghcup" -ErrorAction SilentlyContinue; if ($haskell) { Remove-Item -Recurse -Force "C:\ghcup" }
          $codeql = Get-ChildItem "C:\Program Files\CodeQL" -ErrorAction SilentlyContinue; if ($codeql) { Remove-Item -Recurse -Force "C:\Program Files\CodeQL" }
          Get-PSDrive C | Select-Object Used,Free

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-archives-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-x64-windows-

      - name: Install Qt 6 on Windows
        uses: jurplel/install-qt-action@v4
        id: qt
        with:
          # Pin 6.8.0 (stable metadata for win64_msvc2022_64). qtsvg and
          # qtdeclarative are BASE modules of the arch install (not add-on
          # modules), so they must NOT be listed in -m — aqt errors with
          # "packages not found" when they are.
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          # Qt 6.8+ ships prebuilt binaries only for MSVC 2022
          # (win64_msvc2019_64 was dropped); windows-latest provides MSVC 2022.
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtmultimedia'

      - name: Install GDAL/PROJ/GEOS/Protobuf via vcpkg (preinstalled)
        # Warm-archives pass: restores every package from the seeded cache
        # (minutes). Kept as a step so the manifest/toolchain install in
        # configure agrees with the classic install here.
        shell: pwsh
        run: |
          git -C C:\vcpkg fetch origin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C C:\vcpkg checkout 7f3781e19cc7d4e4882a4caec01668c6f7b5c163
          if ($LASTEXITCODE -ne 0) { exit 1 }
          C:\vcpkg\vcpkg install --triplet x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build qca + qtkeychain against installed Qt
        # Auth is a hard compile dependency of qgis_core (QgsAuthCertUtils /
        # QKeychain used unconditionally in core sources), so the Windows tier
        # builds qca + qtkeychain from source against the aqt-installed Qt.
        # Both are small CMake projects (~5 min total). qca's CMake requires
        # pkg-config, installed via Chocolatey (lands on PATH for
        # FindPkgConfig).
        shell: pwsh
        run: |
          choco install -y --no-progress pkgconfiglite winflexbison
          # #1683: tags are mutable — clone by tag but fail closed unless HEAD
          # is the pinned commit, so a moved/deleted tag cannot silently swap
          # the source that gets compiled into the dependency closure.
          git clone --depth 1 --branch v2.3.10 https://github.com/KDE/qca.git C:\deps\qca-src
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((git -C C:\deps\qca-src rev-parse HEAD) -ne "df5171e3c4baf346581f15af5a040e61b166a332") { throw "qca v2.3.10 pin mismatch" }
          cmake -S C:\deps\qca-src -B C:\deps\qca-build -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt-path }}" -DBUILD_WITH_QT6=ON -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build C:\deps\qca-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --install C:\deps\qca-build --config Release --prefix C:\deps\qca-install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git clone --depth 1 --branch v0.14.0 https://github.com/frankosterfeld/qtkeychain.git C:\deps\kc-src
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((git -C C:\deps\kc-src rev-parse HEAD) -ne "e63da2868465db18eb35a312b2635c26fdc46923") { throw "qtkeychain v0.14.0 pin mismatch" }
          cmake -S C:\deps\kc-src -B C:\deps\kc-build -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt-path }};C:\deps\qca-install" -DBUILD_WITH_QT6=ON -DBUILD_TEST_APPLICATION=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build C:\deps\kc-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --install C:\deps\kc-build --config Release --prefix C:\deps\kc-install
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Configure CMake for Windows MSVC
        run: |
          # winflexbison (via Chocolatey) provides win_bison.exe/win_flex.exe;
          # src/core .yy/.ll grammars require bison >= 3.0.
          $bisonDir = "C:\ProgramData\chocolatey\lib\winflexbison\tools"
          $env:PATH = "$bisonDir;$env:PATH"
          cmake -B build-win -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_LTO=OFF `
            -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt-path }};C:\deps\qca-install;C:\deps\kc-install" `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBISON_EXECUTABLE="$bisonDir\win_bison.exe" `
            -DFLEX_EXECUTABLE="$bisonDir\win_flex.exe" `
            -DENABLE_TESTS=OFF `
            -DSICNU_VENDOR_GDAL=OFF `
            -DX_VCPKG_APPLOCAL_DEPS_INSTALL=ON

      - name: Verify MSVC Compilation Guard & Headers
        run: cmake --build build-win --config Release --parallel

      # #1697: the .cmd twin of the bundle guard, refused at parse time so
      # no build dir or binaries are needed — proves the PowerShell
      # validation actually rejects a traversal --version on real cmd.exe.
      # The refusal is pinned exactly: exit code 2 (the guard's code; the
      # build-dir paths use 1/2 differently) AND the refusal message — any
      # other nonzero failure (e.g. a missing build dir) must NOT pass this
      # smoke (R1-1).
      - name: Offline Bundle Guard Smoke (#1697)
        shell: pwsh
        run: |
          $out = cmd /c "scripts\build_offline_bundle.cmd --build-dir does-not-exist --version 1.0/../../x" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2) { throw "expected guard refusal (exit 2), got exit $LASTEXITCODE; output: $out" }
          if ($out -notmatch 'refusing unsafe --version') { throw "exit 2 but no refusal message; output: $out" }
          Write-Output "guard refused unsafe --version (exit 2)"

      # #1698: the Windows tier stayed compile-only, so install-rule rot
      # (missing INSTALL_RPATH targets, uninstalled worker) went unnoticed.
      # Windows has no RPATH — CMake puts the DLL half of SHARED targets in
      # bin/ next to the executables; the smoke proves the loader is happy.
      - name: Install Tree Smoke (#1698)
        shell: pwsh
        run: |
          cmake --install build-win --config Release --prefix C:\sicnu_install_test
          & C:\sicnu_install_test\bin\sicnu_geo_rs_cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "installed CLI --help failed" }
          if (-not (Test-Path C:\sicnu_install_test\bin\sicnu_worker.exe)) {
            throw "sicnu_worker missing from install tree (#1698)" }

  tier3-platform-macos:
    name: Tier 3 - macOS Clang Configure & Build Seam
    runs-on: macos-latest
    # 360 = GitHub's hard platform cap (see tier1 note). Measured 57m on the
    # latest master run (36568313972).
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # macOS clang+Release is its own compiler/OS/config triple; sharing
          # the Linux key could never hit (different compiler and object
          # formats) and only raced eviction inside the shared entry.
          key: ccache-tier3-macos-clang-Release
          restore-keys: |
            ccache-tier3-macos-clang-Release-
          max-size: 2G

      - name: Install macOS Dependencies via Homebrew
        run: |
          brew update
          brew install qt@6 qca qtkeychain gdal proj geos libzip gsl bison flex pcre2 cmake protobuf jsoncpp opencv libtasn1

      - name: Configure CMake for macOS
        # Homebrew's bison (>= 3.8) and flex are keg-only; macOS ships bison 2.x
        # which cannot parse %define api.pure / %locations in our .yy grammars.
        # Prepend the keg-only bins so CMake's find_package(BISON) picks them up.
        # ENABLE_TESTS=OFF keeps this tier a true cross-platform BUILD SEAM like
        # the Windows tier: full test coverage already runs on Linux (Tier 1/2),
        # and compiling the ~100 Catch2 test executables plus running all 1406
        # tests pushes the macOS job past GitHub's 360-minute job cap.
        run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          bison --version | head -1
          cmake -B build-mac -S . \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix)" \
            -DBISON_EXECUTABLE="$(brew --prefix bison)/bin/bison" \
            -DFLEX_EXECUTABLE="$(brew --prefix flex)/bin/flex" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=OFF \
            -DENABLE_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Verify macOS Build
        # -j2, NOT --parallel (all cores): macOS runners have 7GB RAM and 3-4
        # clang processes on QGIS-scale translation units (~2-3GB each) OOM
        # the runner itself — it dies mid-compile with "lost communication
        # with the server" (observed 3x in a row at 1-3h in). Two jobs keep
        # peak RSS inside the budget; ccache absorbs the extra wall time.
        run: |
          cmake --build build-mac --parallel 2

      # #1682/#1697: pure-shell guard suite (no compiled test binaries, so it
      # fits the build-seam time budget) — pins the .sh bundle path against
      # --version traversal on a real BSD userland.
      - name: Offline Bundle Guard Test (#1697)
        run: sh tests/test_r22_infra_bundle_guard.sh --repo-root .

      # #1698: install + relocation smoke. The install tree relies on
      # @loader_path RPATH on macOS; running the installed CLI with a clean
      # environment proves the loader resolves lib/ without DYLD_* help for
      # the PROJECT's libs. Homebrew kegs are outside dyld's default search
      # list, so external deps are supplied through the FALLBACK path only —
      # it is consulted after @loader_path, so the relocatability proof
      # itself is untouched (R2-1 mitigation).
      - name: Install Tree Smoke (#1698)
        run: |
          cmake --install build-mac --prefix /tmp/sicnu_install_test
          env -i PATH=/usr/bin:/bin HOME="$HOME" QT_QPA_PLATFORM=offscreen \
            DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:$(brew --prefix qt@6)/lib" \
            /tmp/sicnu_install_test/bin/sicnu_geo_rs_cli --help
          test -x /tmp/sicnu_install_test/bin/sicnu_worker
